[project]
name = "fusion-digest-workflow"
version = "0.1.0"
description = "One-shot podcast digest: latest nuclear fusion news plus a PhD-level deep dive into recent publications on neutron diagnostics with synthetic diamond detectors."
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
